<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Web Dialog</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <button command="show-modal" commandfor="dialog:1">Open dialog</button>

    <dialog id="dialog:1" data-appearance="sheet" data-size="medium">
        <header>
            <button commandfor="dialog:1" command="close">Close</button>
            <p> Add Your Title </p>
        </header>
        <div style="width: 100%; display: flex; flex-direction: column;">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg"
                alt="">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg"
                alt="">
            <p>This dialog was opened using an invoker command.</p>
            <button commandfor="dialog:1" command="close">Close</button>
    </dialog>
    <script src="index.js"></script>
</body>

</html>
