<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Web Dialog</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <button command="show-modal" commandfor="dialog:1">Open dialog</button>

    <dialog id="dialog:1" data-appearance="dialog">
        <p>This dialog was opened using an invoker command.</p>
        <button commandfor="dialog:1" command="close">Close</button>
    </dialog>
    <script src="index.js"></script>
</body>

</html>
